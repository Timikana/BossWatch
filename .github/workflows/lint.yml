name: Lint

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua + LuaRocks + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: |
          # Fail the job on errors and warnings. Style warnings are silenced
          # via .luacheckrc — anything that remains is worth attention.
          luacheck . --no-color
